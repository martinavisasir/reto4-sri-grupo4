authoritative;
default-lease-time 600;
max-lease-time 7200;
option domain-name "grupo4reto4.eus";
option domain-name-servers 192.168.4.101, 192.168.4.102;

failover peer "dhcp-failover" {
  primary;
  address 192.168.4.101;
  port 647;
  peer address 192.168.4.102;
  peer port 847;
  max-response-delay 60;
  max-unacked-updates 10;
  mclt 3600;
  split 128;
  load balance max seconds 3;
}

subnet 192.168.4.0 netmask 255.255.255.0 {
  option routers 192.168.4.1;
  option subnet-mask 255.255.255.0;
  option broadcast-address 192.168.4.255;
  pool {
    failover peer "dhcp-failover";
    range 192.168.4.150 192.168.4.199;
  }
}
host server4-g4 {
  hardware ethernet bc:24:11:dc:86:25;
  fixed-address 192.168.4.104;
}
